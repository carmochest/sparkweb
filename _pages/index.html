<!--TITLE: Spark Play Museum — Explore, then play-->
<!--DESC: An interactive play-museum for ages 1–10 near BTS Thonglor, Bangkok. Explore the museum map, then book your visit — all on one page.-->
<main id="main" class="app">

<div class="stage-wrap" id="map" data-stage>
  <div class="stage-main">
    <div class="mm mm--full" data-museum-map>
      <div class="mm-stage">
        <div class="mm-floor"></div>
        <div class="stage-title">
          <p class="hero-kicker"><span class="dot"></span>Bangkok · ages 1–10 · open daily 10–7</p>
          <h1>Explore the museum</h1>
          <p class="lede">Two worlds — The Gallery and The Garden. Spin the floor, tap a zone to see what's inside.</p>
        </div>
        <div class="mm-controls" role="group" aria-label="Map controls">
          <button type="button" class="mm-ctl" data-rot-l aria-label="Rotate left">↺</button>
          <button type="button" class="mm-ctl" data-rot-r aria-label="Rotate right">↻</button>
          <button type="button" class="mm-ctl mm-ctl--ico" data-zoom-in aria-label="Zoom in">+</button>
          <button type="button" class="mm-ctl mm-ctl--ico" data-zoom-out aria-label="Zoom out">−</button>
          <button type="button" class="mm-ctl mm-ctl--wide" data-top>Top view</button>
          <button type="button" class="mm-ctl mm-ctl--wide" data-rot-reset>Reset</button>
        </div>
        <div class="mm-legend" aria-label="Legend">
          <span class="mm-chip mm-z1" data-legend="z1">The Gallery · 13 zones</span>
          <span class="mm-chip mm-z2" data-legend="z2">The Garden · 8 zones</span>
        </div>
        <aside class="mm-panel" hidden></aside>
        <div class="mm-tip" hidden></div>
        <p class="mm-note">Mock layout — real floor plan coming</p>
      </div>
    </div>
  </div>

  {{SHEETS}}
</div>

</main>
